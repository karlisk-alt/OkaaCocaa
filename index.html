<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Line Runner</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:block; }
  #nameWrap {
    display:none;
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:20;
    text-align:center;
    background:rgba(0,0,0,0.93);
    border:2px solid #FFEB3B;
    border-radius:8px;
    padding:22px 32px;
    font-family:monospace;
    min-width:260px;
  }
  #nameTitle { color:#FFEB3B; font-size:20px; font-weight:bold; margin-bottom:6px; }
  #nameSub   { color:rgba(255,255,255,0.55); font-size:12px; margin-bottom:14px; }
  #nameInput {
    font-size:22px; background:#111; color:#FFEB3B;
    border:2px solid #FFEB3B; padding:8px 12px;
    text-align:center; width:180px;
    text-transform:uppercase; font-family:monospace; outline:none; border-radius:4px;
  }
  #nameBtn {
    display:block; margin:14px auto 0;
    font-size:15px; padding:10px 28px;
    background:#FFEB3B; color:#000; border:none;
    cursor:pointer; font-family:monospace; font-weight:bold;
    border-radius:4px; width:100%;
  }
  #nameBtn:active { background:#FFD700; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="nameWrap">
  <div id="nameTitle">★ NEW HIGH SCORE! ★</div>
  <div id="nameSub">Enter your name (max 12 chars)</div>
  <input id="nameInput" maxlength="12" autocomplete="off" autocorrect="off"
         spellcheck="false" placeholder="YOUR NAME">
  <button id="nameBtn">SUBMIT</button>
</div>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   CHARACTER — edit this block to customise your runner
   ════════════════════════════════════════════════════════════════════ */
const CHARACTER = {
  name          : 'Tony',
  w             : 28,
  h             : 44,
  canDoubleJump : true,
  skin          : '#FDBCB4',
  hair          : '#2C1810',
  shirt         : '#FFFFFF',
  pants         : '#1a237e',
  shoes         : '#4E342E',
  tieColor      : '#DC143C',
  hasTie        : true,
  hasMustache   : true,
  hasSunglasses : false,
  hasHat        : false,
  hatColor      : '#2C1810',
  glassColor    : '#1a1a2e',
};

/* ════════════════════════════════════════════════════════════════════
   GAME TUNING
   ════════════════════════════════════════════════════════════════════ */
const CFG = {
  gravity        : 0.55,
  jumpForce      : -13.5,
  runSpeed       : 5.5,
  baseScroll     : 4.5,
  maxScroll      : 22,
  scrollPerLine  : 0.40,
  drainBase      : 0.04,   // 2.5× slower than original
  drainPerUnit   : 0.016,  // 2.5× slower than original
  refillPerLine  : 32,
  cocaineMax     : 100,
  cocaineStart   : 70,
  groundH        : 28,
  coyoteFrames   : 8,
  jumpBufFrames  : 10,
  terminalVel    : 18,
};

/* ─── Canvas ─────────────────────────────────────────────────────── */
const BASE_W = 800, BASE_H = 450;
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
canvas.width  = BASE_W;
canvas.height = BASE_H;
let scale = 1;
function resize() {
  scale = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
  canvas.style.width  = (BASE_W * scale) + 'px';
  canvas.style.height = (BASE_H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ─── Fullscreen + orientation ───────────────────────────────────── */
function requestFS() {
  if (!('ontouchstart' in window)) return;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  var el = document.documentElement;
  var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if (!rfs) return;
  rfs.call(el).then(function() {
    try { screen.orientation.lock('landscape').catch(function(){}); } catch(e) {}
  }).catch(function(){});
}
document.addEventListener('fullscreenchange', function() {
  if (document.fullscreenElement)
    try { screen.orientation.lock('landscape').catch(function(){}); } catch(e) {}
});
document.addEventListener('webkitfullscreenchange', function() {
  if (document.webkitFullscreenElement)
    try { screen.orientation.lock('landscape').catch(function(){}); } catch(e) {}
});

/* ─── roundRect polyfill ─────────────────────────────────────────── */
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Array.isArray(r) ? r[0] : (r || 0);
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x+r,y); this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,   x+w,y+r);
    this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h, x+w-r,y+h);
    this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,   x,y+h-r);
    this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,     x+r,y);
    this.closePath();
  };
}

/* ─── Audio ─────────────────────────────────────────────────────── */
let _ac;
function tone(freq, type, dur, vol, delay) {
  vol = vol || 0.25; delay = delay || 0;
  try {
    if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.connect(g); g.connect(_ac.destination);
    o.type = type; o.frequency.setValueAtTime(freq, _ac.currentTime + delay);
    g.gain.setValueAtTime(0.001, _ac.currentTime + delay);
    g.gain.linearRampToValueAtTime(vol, _ac.currentTime + delay + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, _ac.currentTime + delay + dur);
    o.start(_ac.currentTime + delay); o.stop(_ac.currentTime + delay + dur + 0.05);
  } catch(e) {}
}
const SFX = {
  jump  : () => { tone(440,'square',0.12,0.22); tone(550,'square',0.06,0.12,0.06); },
  snort : () => { tone(900,'sawtooth',0.07,0.28); tone(1400,'sine',0.05,0.18,0.04); tone(1800,'sine',0.03,0.1,0.1); },
  stomp : () => { tone(180,'square',0.18,0.35); tone(260,'square',0.10,0.2,0.05); },
  die   : () => { tone(300,'sawtooth',0.3,0.4); tone(200,'sawtooth',0.35,0.4,0.22); tone(120,'sawtooth',0.6,0.45,0.46); },
  meth  : () => { tone(800,'square',0.08,0.3); tone(1100,'square',0.06,0.25,0.05); tone(600,'square',0.04,0.2,0.12); },
  shroom: () => { tone(300,'sine',0.4,0.2); tone(380,'sine',0.5,0.15,0.15); tone(480,'sine',0.6,0.1,0.3); tone(600,'sine',0.8,0.08,0.5); },
  lsd   : () => { tone(200,'sawtooth',0.1,0.3); tone(400,'sawtooth',0.08,0.25,0.07); tone(800,'sine',0.06,0.2,0.15); },
  devil : () => { tone(80,'sawtooth',2.5,0.35); tone(60,'sawtooth',2.5,0.25,0.1); tone(40,'sine',3,0.2,0.25); },
  god   : () => { tone(440,'sine',0.3,0.18); tone(880,'sine',0.5,0.12,0.1); tone(1320,'sine',1.0,0.08,0.2); tone(660,'sine',2,0.06,0.35); },
};

/* ─── Input ─────────────────────────────────────────────────────── */
const inp = { left:false, right:false };
let jumpBuf = 0;
const pressJump = () => { jumpBuf = CFG.jumpBufFrames; };

window.addEventListener('keydown', e => {
  if (e.code==='ArrowLeft'  || e.code==='KeyA') inp.left  = true;
  if (e.code==='ArrowRight' || e.code==='KeyD') inp.right = true;
  if (['Space','ArrowUp','KeyW'].includes(e.code)) pressJump();
  if (['Space','Enter'].includes(e.code) && gs.state !== 'playing') startGame();
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyD'].includes(e.code))
    e.preventDefault();
}, { passive:false });
window.addEventListener('keyup', e => {
  if (e.code==='ArrowLeft'  || e.code==='KeyA') inp.left  = false;
  if (e.code==='ArrowRight' || e.code==='KeyD') inp.right = false;
});

const TB = {
  left  : { x:18,         y:BASE_H-92, w:72, h:72 },
  right : { x:98,         y:BASE_H-92, w:72, h:72 },
  jump  : { x:BASE_W-98,  y:BASE_H-92, w:80, h:72 },
};
const tch = { left:false, right:false };
function syncTouches(e) {
  e.preventDefault();
  if (e.type === 'touchstart') requestFS();
  tch.left = tch.right = false;
  let doJump = false;
  for (const t of e.touches) {
    const r  = canvas.getBoundingClientRect();
    const gx = (t.clientX - r.left) / scale;
    const gy = (t.clientY - r.top)  / scale;
    const hit = b => gx>=b.x && gx<=b.x+b.w && gy>=b.y && gy<=b.y+b.h;
    if (hit(TB.left))  tch.left  = true;
    if (hit(TB.right)) tch.right = true;
    if (hit(TB.jump))  doJump    = true;
  }
  if (doJump) pressJump();
  if (e.type === 'touchstart' && gs.state !== 'playing') startGame();
}
canvas.addEventListener('touchstart',  syncTouches, {passive:false});
canvas.addEventListener('touchmove',   syncTouches, {passive:false});
canvas.addEventListener('touchend',    syncTouches, {passive:false});
canvas.addEventListener('touchcancel', syncTouches, {passive:false});

// LSD reverses left/right
function goLeft()  { const l=inp.left||tch.left, r=inp.right||tch.right; return gs.effects.lsd>0?r:l; }
function goRight() { const l=inp.left||tch.left, r=inp.right||tch.right; return gs.effects.lsd>0?l:r; }

/* ─── Helpers ────────────────────────────────────────────────────── */
const clamp = (v,lo,hi) => v<lo?lo:v>hi?hi:v;
const rand  = (a,b)     => Math.random()*(b-a)+a;
const randInt=(a,b)     => Math.floor(rand(a,b+1));

function fillRR(x,y,w,h,r,col) {
  ctx.fillStyle=col; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
}

/* ─── Leaderboard ────────────────────────────────────────────────── */
function getBoard() {
  try { return JSON.parse(localStorage.getItem('lr_board')) || []; } catch(e) { return []; }
}
function addToBoard(name, score, lines) {
  const board = getBoard();
  board.push({ name: (name||'ANON').toUpperCase().slice(0,12), score, lines });
  board.sort((a,b) => b.score - a.score);
  const trimmed = board.slice(0,10);
  localStorage.setItem('lr_board', JSON.stringify(trimmed));
  return trimmed;
}
function qualifiesForBoard(score) {
  const board = getBoard();
  return board.length < 10 || score > board[board.length-1].score;
}

/* ─── Game state ─────────────────────────────────────────────────── */
const gs = {
  state      : 'start',
  score      : 0,
  linesCount : 0,
  speed      : CFG.baseScroll,
  coc        : CFG.cocaineStart,
  camX       : 0,
  minCamX    : 0,
  shakeX     : 0, shakeY : 0, shakeMag : 0,
  hue        : 0,
  flashA     : 0,
  flashColor : '#FFFFFF',
  hi         : +(localStorage.getItem('lr_hi') || 0),
  deathT     : 0,
  vision     : null,   // 'devil' | 'god' | null
  visionTimer: 0,
  effects    : { methCount:0, meth:0, shrooms:0, lsd:0 },
  platforms  : [],
  drugItems  : [],
  lineObjs   : [],
  particles  : [],
  popups     : [],
  player     : null,
  nameShown  : false,
};

/* ─── Score multiplier (2× on any drug except cocaine) ───────────── */
function scoreMultiplier() {
  const e = gs.effects;
  return (e.meth>0 || e.shrooms>0 || e.lsd>0) ? 2 : 1;
}

/* ─── Player ─────────────────────────────────────────────────────── */
function makePlayer() {
  return { wx:200, y:BASE_H-CFG.groundH-CHARACTER.h,
    vx:0, vy:0, onGnd:false, coyote:0,
    extraJ:CHARACTER.canDoubleJump?1:0,
    runF:0, runT:0, snortT:0, facing:1, alive:true };
}

function updatePlayer() {
  const p = gs.player;
  if (!p?.alive) return;

  const runMul = gs.effects.meth>0 ? 1.4 : gs.effects.shrooms>0 ? 0.8 : 1;
  const jmpMul = gs.effects.shrooms>0 ? 1.1 : gs.effects.lsd>0 ? 1.15 : 1;
  const spd = CFG.runSpeed * runMul;

  p.vx = goLeft() ? -spd : goRight() ? spd : 0;
  p.wx += p.vx;
  if (p.vx !== 0) p.facing = p.vx > 0 ? 1 : -1;

  p.vy = Math.min(p.vy + CFG.gravity, CFG.terminalVel);
  p.y += p.vy;

  if (p.onGnd) { p.coyote=CFG.coyoteFrames; p.extraJ=CHARACTER.canDoubleJump?1:0; }
  else if (p.coyote>0) p.coyote--;
  p.onGnd = false;

  for (const pl of gs.platforms) {
    if (p.wx+CHARACTER.w<=pl.wx || p.wx>=pl.wx+pl.w) continue;
    if (p.vy < 0) continue;
    const pBot = p.y + CHARACTER.h;
    if (pBot >= pl.y-2 && pBot <= pl.y+pl.h+14) {
      p.y=pl.y-CHARACTER.h; p.vy=0; p.onGnd=true;
    }
  }
  const gndY = BASE_H-CFG.groundH;
  if (p.y+CHARACTER.h>=gndY) { p.y=gndY-CHARACTER.h; p.vy=0; p.onGnd=true; }

  if (jumpBuf > 0) {
    if (p.coyote > 0) {
      p.vy=CFG.jumpForce*jmpMul; p.onGnd=false; p.coyote=0; jumpBuf=0; SFX.jump();
    } else if (p.extraJ > 0) {
      p.vy=CFG.jumpForce*jmpMul*0.88; p.extraJ--; jumpBuf=0; SFX.jump();
      spawnParticles(p.wx-gs.camX+CHARACTER.w/2, p.y+CHARACTER.h, '#00E5FF', 8, 2.5);
    }
  }
  if (jumpBuf>0) jumpBuf--;

  if (p.onGnd && p.vx!==0) {
    const sp = Math.max(3, 14-(gs.speed|0));
    if (++p.runT>=sp) { p.runF=(p.runF+1)%4; p.runT=0; }
  }
  if (p.snortT>0) p.snortT--;

  p.wx = Math.max(p.wx, gs.camX+8);
  if (p.y>BASE_H+100 || p.wx+CHARACTER.w<gs.camX) killPlayer();
}

/* ─── Camera ─────────────────────────────────────────────────────── */
function updateCamera() {
  gs.minCamX += gs.speed * 0.09;
  gs.camX = Math.max(gs.player.wx - BASE_W*0.28, gs.minCamX);
  if (gs.shakeMag > 0.15) {
    gs.shakeX=(Math.random()*2-1)*gs.shakeMag;
    gs.shakeY=(Math.random()*2-1)*gs.shakeMag;
    gs.shakeMag*=0.82;
  } else { gs.shakeX=gs.shakeY=gs.shakeMag=0; }
  gs.flashA = Math.max(0, gs.flashA-0.05);
}

/* ─── Platform generation ────────────────────────────────────────── */
let nextPlatX = 350;
function genPlatforms() {
  const horizon = gs.camX + BASE_W + 700;
  while (nextPlatX < horizon) {
    const prev  = gs.platforms.at(-1);
    const prevY = prev ? prev.y : BASE_H-CFG.groundH-30;
    const gap = clamp(rand(60,110)+gs.speed*3.5, 55, 210);
    const w   = clamp(rand(110,270)-gs.speed*2.5, 72, 260);
    const y   = clamp(prevY+rand(-100,100), 100, BASE_H-CFG.groundH-55);
    const nLines  = Math.random()>0.25 ? randInt(1,Math.min(3,1+(gs.linesCount/12|0))) : 0;
    const hasDrug = Math.random() < 0.28;

    const pl = { wx:nextPlatX+gap, y, w:Math.round(w), h:18 };
    gs.platforms.push(pl);

    for (let i=0; i<nLines; i++) {
      const sp=pl.w/(nLines+1);
      gs.lineObjs.push({ wx:pl.wx+sp*(i+1), y:pl.y-12, w:24, h:5, done:false });
    }
    if (hasDrug) spawnDrug(pl);
    nextPlatX = pl.wx + pl.w;
  }
  gs.platforms = gs.platforms.filter(p=>p.wx+p.w>gs.camX-200);
  gs.lineObjs  = gs.lineObjs.filter(l=>!l.done && l.wx>gs.camX-100);
}

/* ─── Drug system ────────────────────────────────────────────────── */
const DRUG_SIZES = { meth:{w:16,h:22}, shrooms:{w:18,h:22}, lsd:{w:14,h:14} };

function spawnDrug(pl) {
  const r    = Math.random();
  const type = r<0.45 ? 'meth' : r<0.75 ? 'shrooms' : 'lsd';
  const sz   = DRUG_SIZES[type];
  gs.drugItems.push({
    wx:pl.wx + pl.w*(0.2+Math.random()*0.6),
    y:pl.y - sz.h - 6,
    type, w:sz.w, h:sz.h, collected:false, t:0,
  });
}

function updateDrugs() {
  const p = gs.player;
  if (!p?.alive) return;
  for (const d of gs.drugItems) {
    if (d.collected) continue;
    d.t++;
    const dx = Math.abs(p.wx+CHARACTER.w/2 - (d.wx+d.w/2));
    const dy = Math.abs(p.y+CHARACTER.h/2  - (d.y+d.h/2));
    if (dx < (CHARACTER.w/2+d.w/2)*0.85 && dy < (CHARACTER.h/2+d.h/2)*0.85)
      collectDrug(d);
  }
  gs.drugItems = gs.drugItems.filter(d=>!d.collected && d.wx>gs.camX-200);
}

function collectDrug(d) {
  d.collected = true;
  const sx = d.wx - gs.camX;

  if (d.type === 'meth') {
    gs.effects.methCount++;
    gs.effects.meth = 600;
    gs.shakeMag = 8;
    if (gs.effects.methCount >= 2) {
      spawnParticles(sx, d.y, '#88AAFF', 35, 7);
      spawnParticles(sx, d.y, '#FFFFFF', 15, 4);
      addPopup(sx, d.y-30, 'OVERDOSE!!');
      gs.flashA=0.9; gs.flashColor='#8888FF';
      setTimeout(killPlayer, 400);
      return;
    }
    spawnParticles(sx, d.y, '#C8E8FF', 18, 3);
    addPopup(sx, d.y-20, 'TWEAKING!');
    gs.flashA=0.3; gs.flashColor='#AACCFF';
    SFX.meth();

  } else if (d.type === 'shrooms') {
    gs.effects.shrooms = 1200;
    spawnParticles(sx, d.y, '#FF6B35', 18, 3);
    spawnParticles(sx, d.y, '#9B59B6', 12, 2.5);
    addPopup(sx, d.y-20, "TRIPPIN'!");
    gs.flashA=0.35; gs.flashColor='#FF44AA';
    SFX.shroom();
    if (Math.random() < 1/3) triggerVision(Math.random()<0.5 ? 'devil' : 'god');

  } else if (d.type === 'lsd') {
    gs.effects.lsd = 900;
    spawnParticles(sx, d.y, '#FF00FF', 20, 3.5);
    spawnParticles(sx, d.y, '#00FFFF', 12, 2.5);
    addPopup(sx, d.y-20, 'REVERSED!');
    gs.flashA=0.35; gs.flashColor='#FF00FF';
    gs.shakeMag=6;
    SFX.lsd();
  }

  gs.score += 250 * scoreMultiplier();
}

function triggerVision(type) {
  gs.vision      = type;
  gs.visionTimer = 180;
  type === 'devil' ? SFX.devil() : SFX.god();
}

function updateEffects() {
  const e = gs.effects;
  if (e.meth    > 0) e.meth--;
  if (e.shrooms > 0) e.shrooms--;
  if (e.lsd     > 0) e.lsd--;
  // Extra shake while tweaking
  if (e.meth > 0 && Math.random() < 0.15) gs.shakeMag = Math.max(gs.shakeMag, 2.5);
}

/* ─── Cocaine lines ──────────────────────────────────────────────── */
const SNORT_MSGS = ['SNORTED!','RAILED!','GET SOME!','WHOOSH!','YIKES!','LET\'S GO!'];
let snortIdx = 0;

function updateLineObjs() {
  const p = gs.player;
  if (!p?.alive) return;
  for (const l of gs.lineObjs) {
    if (l.done) continue;
    const dx = Math.abs(p.wx+CHARACTER.w/2 - l.wx);
    const dy = Math.abs(p.y+CHARACTER.h    - (l.y+l.h));
    if (dx<18 && dy<24) collectLine(l);
  }
}
function collectLine(l) {
  l.done = true;
  gs.linesCount++;
  gs.score   += (100+(gs.speed*12|0)) * scoreMultiplier();
  gs.coc      = Math.min(CFG.cocaineMax, gs.coc   + CFG.refillPerLine);
  gs.speed    = Math.min(CFG.maxScroll,  gs.speed + CFG.scrollPerLine);
  gs.flashA   = 0.4; gs.flashColor='#FFFFFF';
  gs.shakeMag = 2+gs.speed*0.22;
  gs.player.snortT = 25;
  const sx = l.wx - gs.camX;
  spawnParticles(sx,l.y,'#FFFFFF',22,4);
  spawnParticles(sx,l.y,'#00E5FF', 8,2.5);
  addPopup(sx,l.y-22,SNORT_MSGS[snortIdx++%SNORT_MSGS.length]);
  SFX.snort();
}

function updateCocaine() {
  gs.coc -= CFG.drainBase + CFG.drainPerUnit * gs.speed;
  if (gs.coc<=0) { gs.coc=0; killPlayer(); }
}

/* ─── Particles + Popups ─────────────────────────────────────────── */
function spawnParticles(sx,sy,color,n,spd) {
  for (let i=0;i<n;i++) {
    const a=rand(0,Math.PI*2), s=rand(0.4,spd);
    gs.particles.push({ x:sx,y:sy, vx:Math.cos(a)*s, vy:Math.sin(a)*s-rand(0.5,2.5),
      life:1, decay:rand(0.022,0.055), r:rand(1.5,4.5), color });
  }
}
function updateParticles() {
  for (const p of gs.particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.13; p.life-=p.decay; }
  gs.particles = gs.particles.filter(p=>p.life>0);
}

function addPopup(sx,sy,text) { gs.popups.push({x:sx,y:sy,vy:-0.85,text,life:1}); }
function updatePopups() {
  for (const p of gs.popups) { p.y+=p.vy; p.life-=0.025; }
  gs.popups = gs.popups.filter(p=>p.life>0);
}

/* ─── Kill ───────────────────────────────────────────────────────── */
function killPlayer() {
  if (!gs.player?.alive) return;
  gs.player.alive=false; gs.state='dead'; gs.deathT=130; gs.shakeMag=12;
  if (gs.score>gs.hi) { gs.hi=gs.score; localStorage.setItem('lr_hi',gs.hi); }
  const cx=gs.player.wx-gs.camX+CHARACTER.w/2, cy=gs.player.y+CHARACTER.h/2;
  spawnParticles(cx,cy,'#FF1744',28,5.5);
  spawnParticles(cx,cy,'#FFFFFF',10,3);
  SFX.die();
}

/* ════════════════════════════════════════════════════════════════════
   DRAW
   ════════════════════════════════════════════════════════════════════ */

/* Drug visual filter */
function getDrugFilter() {
  let f = '';
  if (gs.effects.shrooms>0) {
    const h=(Date.now()/25)%360;
    f += `hue-rotate(${h|0}deg) saturate(2.5) `;
  }
  if (gs.effects.lsd>0) {
    const lh=(Date.now()/15)%360;
    f += `hue-rotate(${lh|0}deg) saturate(5) contrast(1.35) `;
  }
  if (gs.effects.meth>0) f += 'brightness(1.28) saturate(1.7) ';
  return f.trim();
}

function drawBG() {
  const t = gs.speed/CFG.maxScroll;
  const sg = ctx.createLinearGradient(0,0,0,BASE_H-CFG.groundH);
  if (t<0.3) {
    sg.addColorStop(0,'#04041a'); sg.addColorStop(1,'#0d0d30');
  } else if (t<0.65) {
    sg.addColorStop(0,`hsl(${(270+gs.hue*.1)%360},65%,7%)`);
    sg.addColorStop(1,`hsl(${(240+gs.hue*.1)%360},55%,17%)`);
  } else {
    sg.addColorStop(0,`hsl(${gs.hue%360},85%,10%)`);
    sg.addColorStop(1,`hsl(${(gs.hue+50)%360},80%,22%)`);
  }
  ctx.fillStyle=sg; ctx.fillRect(0,0,BASE_W,BASE_H-CFG.groundH);

  // Stars
  if (t<0.5) {
    ctx.fillStyle=`rgba(255,255,255,${(0.5-t)*1.8})`;
    for (let i=0;i<60;i++) {
      const sx=((i*137.5+gs.camX*0.03)%BASE_W+BASE_W)%BASE_W;
      const sy=(i*71+5)%(BASE_H-CFG.groundH-20);
      ctx.fillRect(sx,sy,i%7===0?2.2:i%3===0?1.8:1.2, i%7===0?2.2:i%3===0?1.8:1.2);
    }
  }
  // Speed streaks
  if (t>0.45) {
    const la=(t-0.45)*0.7;
    ctx.strokeStyle=`rgba(255,255,255,${la*0.55})`; ctx.lineWidth=1;
    for (let i=0;i<20;i++) {
      const lx=((i*67-gs.camX*(0.35+t*0.5))%BASE_W+BASE_W*3)%BASE_W;
      const ly=(i*73+Math.sin(i*2.1)*40)%(BASE_H-CFG.groundH-15)+8;
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx-(20+t*85),ly); ctx.stroke();
    }
  }
  // Shrooms: floating orbs
  if (gs.effects.shrooms>0) {
    const now=Date.now()/1000;
    for (let i=0;i<14;i++) {
      const bx=((i*139+now*25)%BASE_W+BASE_W)%BASE_W;
      const by=(Math.sin(now*0.6+i)*0.5+0.5)*(BASE_H-CFG.groundH);
      const br=12+Math.sin(now*1.2+i)*6;
      ctx.globalAlpha=0.18;
      ctx.fillStyle=`hsl(${(i*26+now*45)%360},90%,65%)`;
      ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // Ground
  const gg=ctx.createLinearGradient(0,BASE_H-CFG.groundH,0,BASE_H);
  gg.addColorStop(0,'#4a3a2a'); gg.addColorStop(1,'#1a1210');
  ctx.fillStyle=gg; ctx.fillRect(0,BASE_H-CFG.groundH,BASE_W,CFG.groundH);
  ctx.fillStyle='#6a5a4a'; ctx.fillRect(0,BASE_H-CFG.groundH,BASE_W,2);
}

function drawPlatforms() {
  const shroomBob = gs.effects.shrooms>0 ? Math.sin(Date.now()/400)*4 : 0;
  for (const pl of gs.platforms) {
    const sx=pl.wx-gs.camX+gs.shakeX;
    if (sx+pl.w<0||sx>BASE_W) continue;
    const sy=pl.y+gs.shakeY+shroomBob;
    const pg=ctx.createLinearGradient(sx,sy,sx,sy+pl.h);
    pg.addColorStop(0,'#8a7a6a'); pg.addColorStop(1,'#3a2a1a');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.roundRect(sx,sy,pl.w,pl.h,4); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.roundRect(sx+2,sy+2,pl.w-4,4,2); ctx.fill();
  }
}

function drawLineObjs() {
  const now=Date.now()/250;
  for (const l of gs.lineObjs) {
    if (l.done) continue;
    const sx=l.wx-gs.camX+gs.shakeX;
    if (sx<-40||sx>BASE_W+40) continue;
    const sy=l.y+gs.shakeY;
    ctx.fillStyle='rgba(170,240,255,0.28)';
    ctx.fillRect(sx-l.w/2-4,sy-3,l.w+8,l.h+6);
    ctx.fillStyle='rgba(255,255,255,0.97)';
    ctx.fillRect(sx-l.w/2,sy,l.w,l.h);
    const sp=0.55+0.45*Math.sin(now+l.wx*0.05);
    ctx.fillStyle=`rgba(255,255,255,${sp})`;
    ctx.fillRect(sx-3,sy-4,5,3);
  }
}

/* ── Drug items ───────────────────────────────────────────────────── */
function drawDrugs() {
  const bob = Date.now()/400;
  for (const d of gs.drugItems) {
    if (d.collected) continue;
    const sx=d.wx-gs.camX+gs.shakeX;
    if (sx+d.w<-5||sx>BASE_W+5) continue;
    const sy=d.y+gs.shakeY+Math.sin(bob+d.wx*0.05)*3;
    if      (d.type==='meth')   drawMeth(sx,sy,d);
    else if (d.type==='shrooms') drawShroom(sx,sy,d);
    else                         drawLSDtab(sx,sy,d);
  }
}

function drawMeth(sx,sy,d) {
  // Glow
  ctx.fillStyle='rgba(100,170,255,0.25)';
  ctx.beginPath(); ctx.ellipse(sx+d.w/2,sy+d.h/2,d.w*0.8,d.h*0.8,0,0,Math.PI*2); ctx.fill();
  // Main crystal (hexagonal-ish shard)
  ctx.fillStyle='#C8E8FF';
  ctx.beginPath();
  ctx.moveTo(sx+d.w/2, sy);
  ctx.lineTo(sx+d.w,   sy+d.h*0.35);
  ctx.lineTo(sx+d.w*0.85,sy+d.h);
  ctx.lineTo(sx+d.w*0.15,sy+d.h);
  ctx.lineTo(sx,       sy+d.h*0.35);
  ctx.closePath(); ctx.fill();
  // Inner highlight
  ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.beginPath();
  ctx.moveTo(sx+d.w/2, sy+2);
  ctx.lineTo(sx+d.w*0.8, sy+d.h*0.3);
  ctx.lineTo(sx+d.w/2, sy+d.h*0.45);
  ctx.closePath(); ctx.fill();
  // Label
  ctx.fillStyle='rgba(180,220,255,0.85)'; ctx.font='bold 7px monospace'; ctx.textAlign='center';
  ctx.fillText('METH',sx+d.w/2,sy+d.h+9); ctx.textAlign='left';
}

function drawShroom(sx,sy,d) {
  // Stem
  fillRR(sx+d.w*0.28,sy+d.h*0.52,d.w*0.44,d.h*0.48,3,'#C8A060');
  // Cap
  ctx.fillStyle='#CC2200';
  ctx.beginPath(); ctx.ellipse(sx+d.w/2,sy+d.h*0.48,d.w*0.5,d.h*0.46,0,Math.PI,0); ctx.closePath(); ctx.fill();
  // Spots
  ctx.fillStyle='#FFFFFF';
  ctx.beginPath(); ctx.arc(sx+d.w*0.28,sy+d.h*0.32,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+d.w*0.65,sy+d.h*0.30,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+d.w*0.50,sy+d.h*0.20,1.8,0,Math.PI*2); ctx.fill();
  // Glow
  ctx.globalAlpha=0.2; ctx.fillStyle='#9B59B6';
  ctx.beginPath(); ctx.ellipse(sx+d.w/2,sy+d.h*0.48,d.w*0.65,d.h*0.55,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(180,100,255,0.8)'; ctx.font='bold 7px monospace'; ctx.textAlign='center';
  ctx.fillText('SHROOMS',sx+d.w/2,sy+d.h+9); ctx.textAlign='left';
}

function drawLSDtab(sx,sy,d) {
  const hue=(Date.now()/20)%360;
  // Rainbow border glow
  ctx.globalAlpha=0.45;
  ctx.fillStyle=`hsl(${hue},100%,60%)`;
  ctx.beginPath(); ctx.roundRect(sx-3,sy-3,d.w+6,d.h+6,4); ctx.fill();
  ctx.globalAlpha=1;
  // Tab body
  fillRR(sx,sy,d.w,d.h,2,`hsl(${(hue+40)%360},80%,75%)`);
  // Perforations
  ctx.fillStyle='rgba(0,0,0,0.3)';
  for (const [px,py] of [[sx+2.5,sy+2.5],[sx+d.w-2.5,sy+2.5],[sx+2.5,sy+d.h-2.5],[sx+d.w-2.5,sy+d.h-2.5]]) {
    ctx.beginPath(); ctx.arc(px,py,1.5,0,Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=0.8;
  ctx.strokeRect(sx+2.5,sy+2.5,d.w-5,d.h-5);
  ctx.fillStyle='rgba(255,0,255,0.9)'; ctx.font='bold 7px monospace'; ctx.textAlign='center';
  ctx.fillText('LSD',sx+d.w/2,sy+d.h+9); ctx.textAlign='left';
}

/* ── Player ───────────────────────────────────────────────────────── */
function drawPlayer() {
  const p=gs.player; if (!p) return;
  const W=CHARACTER.w, H=CHARACTER.h;
  const sx=p.wx-gs.camX+gs.shakeX;
  const sy=p.y+gs.shakeY;
  if (!p.alive) ctx.globalAlpha=0.25;

  ctx.save();
  ctx.translate(sx+W/2,sy+H/2); ctx.scale(p.facing,1); ctx.translate(-W/2,-H/2);

  const snob=p.snortT>0?Math.sin(p.snortT*0.8)*2.2:0;
  const legs=[0,-5,0,5];
  const ll=p.onGnd?legs[p.runF]:-2;
  const rl=p.onGnd?legs[(p.runF+2)%4]:2;

  fillRR(0,      H-8+ll, 12,8,3,CHARACTER.shoes);
  fillRR(W-12,   H-8+rl, 12,8,3,CHARACTER.shoes);
  ctx.fillStyle=CHARACTER.pants;
  ctx.fillRect(1,     H-18+ll,11,12);
  ctx.fillRect(W-12,  H-18+rl,11,12);
  fillRR(2,H-34+snob*.3,W-4,18,3,CHARACTER.shirt);

  if (CHARACTER.hasTie) {
    const ty=H-34+snob*.3+1;
    ctx.fillStyle=CHARACTER.tieColor;
    ctx.beginPath();
    ctx.moveTo(W/2-2,ty); ctx.lineTo(W/2+2,ty);
    ctx.lineTo(W/2+3,ty+10); ctx.lineTo(W/2,ty+14); ctx.lineTo(W/2-3,ty+10);
    ctx.closePath(); ctx.fill();
  }
  const hy=H-46+snob;
  fillRR(3,hy,W-6,18,4,CHARACTER.skin);
  ctx.fillStyle=CHARACTER.hair;
  ctx.beginPath();
  ctx.moveTo(7,hy); ctx.lineTo(W-7,hy);
  ctx.quadraticCurveTo(W-3,hy,W-3,hy+4);
  ctx.lineTo(W-3,hy+8); ctx.lineTo(3,hy+8); ctx.lineTo(3,hy+4);
  ctx.quadraticCurveTo(3,hy,7,hy); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.fillRect(5,hy+9,5,5); ctx.fillRect(W-10,hy+9,5,5);
  if (CHARACTER.hasSunglasses) {
    fillRR(4,hy+8,7,6,2,CHARACTER.glassColor);
    fillRR(W-11,hy+8,7,6,2,CHARACTER.glassColor);
  } else {
    ctx.fillStyle='#1a1a1a';
    ctx.fillRect(6,hy+10,3,3); ctx.fillRect(W-9,hy+10,3,3);
  }
  if (CHARACTER.hasMustache) {
    ctx.fillStyle=CHARACTER.hair;
    ctx.beginPath(); ctx.ellipse(W/2,hy+15,5.5,2.5,0,0,Math.PI); ctx.fill();
  }
  if (CHARACTER.hasHat) {
    ctx.fillStyle=CHARACTER.hatColor;
    ctx.fillRect(0,hy-6,W,6); ctx.fillRect(3,hy-16,W-6,11);
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawParticles() {
  for (const p of gs.particles) {
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x|0,p.y|0,p.r|0,p.r|0);
  }
  ctx.globalAlpha=1;
}

function drawPopups() {
  ctx.font='bold 13px monospace'; ctx.textAlign='center';
  for (const p of gs.popups) {
    ctx.globalAlpha=p.life*p.life; ctx.fillStyle='#fff';
    ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1; ctx.textAlign='left';
}

/* ── HUD ──────────────────────────────────────────────────────────── */
function drawHUD() {
  const cRat=gs.coc/CFG.cocaineMax, spdT=gs.speed/CFG.maxScroll;
  const e=gs.effects;
  const mw=170,mh=18,mx=BASE_W/2-mw/2,my=10;

  ctx.font='bold 9px monospace'; ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.textAlign='right';
  ctx.fillText('NEED \u25b8',mx-5,my+12);
  fillRR(mx,my,mw,mh,4,'rgba(0,0,0,0.55)');
  const mc=cRat>0.6?'#00E5FF':cRat>0.28?'#FFEB3B':'#FF1744';
  if (cRat<0.25) ctx.globalAlpha=0.7+0.3*Math.sin(Date.now()/95);
  fillRR(mx,my,mw*cRat,mh,4,mc);
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(mx,my,mw,mh,4); ctx.stroke();

  ctx.font='bold 15px monospace'; ctx.fillStyle='#fff'; ctx.textAlign='right';
  ctx.fillText(String(gs.score).padStart(8,'0'),BASE_W-8,22);
  ctx.font='10px monospace'; ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.fillText(`${gs.linesCount} lines`,BASE_W-8,35);

  ctx.textAlign='left';
  ctx.font='bold 11px monospace';
  ctx.fillStyle=spdT>0.7?'#FF5722':spdT>0.4?'#FFEB3B':'#aaa';
  ctx.fillText(`\u00d7${gs.speed.toFixed(1)}`,8,22);

  // Active drug effect indicators
  let iy=36;
  if (e.meth>0) {
    const t2=e.meth/600;
    const col=e.methCount>=1?'#AACCFF':'#AACCFF';
    ctx.fillStyle=col; ctx.font='bold 9px monospace';
    ctx.fillText(`TWEAK ${(e.meth/60).toFixed(0)}s`,8,iy); iy+=11;
  }
  if (e.shrooms>0) {
    ctx.fillStyle='#FF6B35'; ctx.font='bold 9px monospace';
    ctx.fillText(`TRIPPIN ${(e.shrooms/60).toFixed(0)}s`,8,iy); iy+=11;
  }
  if (e.lsd>0) {
    ctx.fillStyle='#FF00FF'; ctx.font='bold 9px monospace';
    const pulse=0.6+0.4*Math.sin(Date.now()/120);
    ctx.globalAlpha=pulse;
    ctx.fillText(`\u21c6 REVERSED ${(e.lsd/60).toFixed(0)}s`,8,iy);
    ctx.globalAlpha=1; iy+=11;
  }

  // Meth count warning
  if (e.methCount===1) {
    ctx.font='bold 10px monospace';
    const pulse=0.6+0.4*Math.sin(Date.now()/200);
    ctx.globalAlpha=pulse; ctx.fillStyle='#AACCFF';
    ctx.fillText('\u26a1 METH 1/2 — NEXT = DEATH',8,iy);
    ctx.globalAlpha=1;
  }

  // Score 2× indicator
  if (scoreMultiplier()===2) {
    ctx.fillStyle='#FFEB3B'; ctx.font='bold 10px monospace'; ctx.textAlign='right';
    const pulse=0.8+0.2*Math.sin(Date.now()/180);
    ctx.globalAlpha=pulse;
    ctx.fillText('2\u00d7 SCORE',BASE_W-8,46);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

/* ── Touch buttons ────────────────────────────────────────────────── */
function drawTouchBtns() {
  if (!('ontouchstart' in window)) return;
  const btn=(b,label)=>{
    ctx.globalAlpha=0.38; fillRR(b.x,b.y,b.w,b.h,14,'rgba(255,255,255,0.85)');
    ctx.globalAlpha=0.65; ctx.fillStyle='#222'; ctx.font='bold 22px sans-serif';
    ctx.textAlign='center'; ctx.fillText(label,b.x+b.w/2,b.y+b.h/2+8); ctx.globalAlpha=1;
  };
  // Swap button labels when LSD reverses controls
  if (gs.effects.lsd>0) { btn(TB.left,'▶'); btn(TB.right,'◀'); }
  else                   { btn(TB.left,'◀'); btn(TB.right,'▶'); }
  btn(TB.jump,'▲');
  ctx.textAlign='left';
}

/* ── Screen effects ───────────────────────────────────────────────── */
function drawEffects() {
  const t=gs.speed/CFG.maxScroll, cRat=gs.coc/CFG.cocaineMax;
  const vg=ctx.createRadialGradient(BASE_W/2,BASE_H/2,BASE_H*0.2,BASE_W/2,BASE_H/2,BASE_H);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,`rgba(0,0,0,${0.35+t*0.25})`);
  ctx.fillStyle=vg; ctx.fillRect(0,0,BASE_W,BASE_H);
  if (gs.flashA>0) {
    ctx.fillStyle=gs.flashColor.replace(')',`,${gs.flashA})`).replace('rgb(','rgba(').replace('#','');
    // Simpler: just use rgba
    const fa=gs.flashA;
    if (gs.flashColor==='#FFFFFF') ctx.fillStyle=`rgba(255,255,255,${fa})`;
    else if (gs.flashColor==='#8888FF') ctx.fillStyle=`rgba(136,136,255,${fa})`;
    else if (gs.flashColor==='#AACCFF') ctx.fillStyle=`rgba(170,200,255,${fa})`;
    else if (gs.flashColor==='#FF44AA') ctx.fillStyle=`rgba(255,68,170,${fa})`;
    else if (gs.flashColor==='#FF00FF') ctx.fillStyle=`rgba(255,0,255,${fa})`;
    ctx.fillRect(0,0,BASE_W,BASE_H);
  }
  if (cRat<0.25) {
    const w=(0.25-cRat)/0.25;
    ctx.fillStyle=`rgba(200,0,0,${w*(0.5+0.5*Math.sin(Date.now()/120))*0.30})`;
    ctx.fillRect(0,0,BASE_W,BASE_H);
  }
  if (t>0.62) {
    ctx.fillStyle=`hsla(${gs.hue*2%360},100%,55%,${(t-0.62)*0.07})`;
    ctx.fillRect(0,0,BASE_W,BASE_H);
  }
}

/* ── Vision overlays (devil / god) ───────────────────────────────── */
function drawVision() {
  if (!gs.vision || gs.visionTimer<=0) return;
  const prog=gs.visionTimer/180;
  const alpha=Math.min((1-prog)*4,1)*Math.min(prog*4,1);
  if (gs.vision==='devil') drawDevil(alpha);
  else                      drawGod(alpha);
}

function drawDevil(alpha) {
  const cx=BASE_W/2, cy=BASE_H/2+15;
  const t=Date.now()/500, pulse=1+Math.sin(t*2)*0.04;

  ctx.fillStyle=`rgba(5,0,0,${alpha*0.90})`; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.globalAlpha=alpha;

  // Pulsing red radial glow
  const rg=ctx.createRadialGradient(cx,cy,30,cx,cy,220);
  rg.addColorStop(0,`rgba(140,0,0,0.5)`); rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,BASE_W,BASE_H);

  ctx.save(); ctx.translate(cx,cy); ctx.scale(pulse,pulse);

  // Head
  ctx.fillStyle='#150000';
  ctx.beginPath(); ctx.ellipse(0,0,85,95,0,0,Math.PI*2); ctx.fill();

  // Horns
  ctx.fillStyle='#8B0000';
  ctx.beginPath();
  ctx.moveTo(-55,-65); ctx.bezierCurveTo(-80,-120,-95,-155,-45,-170);
  ctx.bezierCurveTo(-55,-130,-35,-85,-25,-72); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(55,-65); ctx.bezierCurveTo(80,-120,95,-155,45,-170);
  ctx.bezierCurveTo(55,-130,35,-85,25,-72); ctx.closePath(); ctx.fill();

  // Eyes (glowing)
  const ep=0.7+0.3*Math.sin(t*3.5);
  ctx.shadowColor='#FF0000'; ctx.shadowBlur=25;
  ctx.fillStyle=`rgba(255,25,0,${ep})`;
  ctx.beginPath(); ctx.ellipse(-30,-18,24,17,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(30,-18,24,17,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(-30,-18,11,13,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(30,-18,11,13,0,0,Math.PI*2); ctx.fill();

  // Eyebrows (sharp V)
  ctx.strokeStyle='#550000'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-52,-30); ctx.lineTo(-20,-22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(52,-30); ctx.lineTo(20,-22); ctx.stroke();

  // Mouth (evil grin)
  ctx.fillStyle='#550000';
  ctx.beginPath(); ctx.arc(0,45,55,0.05*Math.PI,0.95*Math.PI); ctx.closePath(); ctx.fill();
  // Teeth
  ctx.fillStyle='#FFCCCC';
  for (let i=0;i<6;i++) {
    const tx=-44+i*17;
    ctx.beginPath();
    ctx.moveTo(tx,46); ctx.lineTo(tx+8,46); ctx.lineTo(tx+4,63); ctx.closePath(); ctx.fill();
  }

  ctx.restore();

  // Text
  ctx.textAlign='center'; ctx.shadowColor='#FF0000'; ctx.shadowBlur=18;
  ctx.font='bold 30px monospace';
  const tp=0.8+0.2*Math.sin(t*4);
  ctx.fillStyle=`rgba(255,30,0,${tp})`;
  ctx.fillText('DEVIL AWAITS YOU',cx,55);
  ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign='left';
}

function drawGod(alpha) {
  const cx=BASE_W/2, cy=BASE_H/2+10;
  const t=Date.now()/500, pulse=1+Math.sin(t*1.5)*0.04;

  ctx.fillStyle=`rgba(255,248,200,${alpha*0.85})`; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.globalAlpha=alpha;

  // Rotating rays
  ctx.save(); ctx.translate(cx,cy);
  for (let i=0;i<18;i++) {
    const a=(i/18)*Math.PI*2+t*0.25;
    ctx.fillStyle=`rgba(255,215,50,${0.25+i%2*0.12})`;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a-0.12)*290,Math.sin(a-0.12)*290);
    ctx.lineTo(Math.cos(a+0.12)*290,Math.sin(a+0.12)*290);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  ctx.save(); ctx.translate(cx,cy); ctx.scale(pulse,pulse);

  // Halo
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=9;
  ctx.shadowColor='#FFD700'; ctx.shadowBlur=22;
  ctx.beginPath(); ctx.arc(0,-95,58,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur=0;

  // Face
  const fg=ctx.createRadialGradient(0,0,20,0,0,90);
  fg.addColorStop(0,'#FFFBEE'); fg.addColorStop(1,'#FFE8A0');
  ctx.fillStyle=fg;
  ctx.beginPath(); ctx.ellipse(0,5,82,90,0,0,Math.PI*2); ctx.fill();

  // Eyes (kind)
  ctx.fillStyle='#87CEEB';
  ctx.beginPath(); ctx.ellipse(-27,-5,19,13,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(27,-5,19,13,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a3a6a';
  ctx.beginPath(); ctx.ellipse(-27,-5,9,10,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(27,-5,9,10,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-23,-8,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(31,-8,3,0,Math.PI*2); ctx.fill();

  // Eyebrows (gentle arch)
  ctx.strokeStyle='#C8A060'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(-27,-18,18,Math.PI*1.2,Math.PI*1.8); ctx.stroke();
  ctx.beginPath(); ctx.arc(27,-18,18,Math.PI*1.2,Math.PI*1.8); ctx.stroke();

  // Smile
  ctx.strokeStyle='#C8A060'; ctx.lineWidth=3.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,35,38,0.12*Math.PI,0.88*Math.PI); ctx.stroke();

  ctx.restore();

  ctx.textAlign='center'; ctx.shadowColor='#FFD700'; ctx.shadowBlur=15;
  ctx.font='bold 32px monospace'; ctx.fillStyle='#7B5800';
  ctx.fillText('GOD FORGIVES YOU',cx,44);
  ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign='left';
}

/* ── Portrait warning ─────────────────────────────────────────────── */
function drawPortraitWarning() {
  if (!('ontouchstart' in window)) return;
  if (window.innerHeight<=window.innerWidth) return;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,BASE_W,BASE_H);
  const cx=BASE_W/2, cy=BASE_H/2, t=Date.now()/1000;
  ctx.save(); ctx.translate(cx,cy-55);
  const rock=Math.sin(t*1.8)*0.25; ctx.rotate(rock);
  fillRR(-18,-32,36,64,7,'#444');
  fillRR(-14,-26,28,52,4,'#111');
  ctx.fillStyle='#00E5FF'; ctx.fillRect(-12,-22,26,42);
  ctx.fillStyle='#555'; ctx.beginPath(); ctx.arc(0,24,4,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(cx,cy-55);
  ctx.strokeStyle='#FFEB3B'; ctx.lineWidth=3.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,56,-Math.PI*0.75,Math.PI*0.2); ctx.stroke();
  const ea=Math.PI*0.2;
  ctx.fillStyle='#FFEB3B'; ctx.save();
  ctx.translate(56*Math.cos(ea),56*Math.sin(ea)); ctx.rotate(ea+Math.PI/2);
  ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(7,5); ctx.lineTo(-7,5);
  ctx.closePath(); ctx.fill(); ctx.restore(); ctx.restore();
  ctx.textAlign='center'; ctx.font='bold 22px monospace'; ctx.fillStyle='#FFEB3B';
  ctx.fillText('ROTATE YOUR DEVICE',cx,cy+38);
  ctx.font='13px monospace'; ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText('landscape mode required',cx,cy+60);
  ctx.textAlign='left';
}

/* ── Leaderboard table ────────────────────────────────────────────── */
function drawLeaderboard(cx,startY,maxRows) {
  const board=getBoard().slice(0,maxRows);
  if (!board.length) return;
  ctx.font='bold 11px monospace'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.textAlign='center';
  ctx.fillText('─── TOP SCORES ───',cx,startY);
  ctx.font='12px monospace';
  for (let i=0;i<board.length;i++) {
    const e=board[i];
    const y=startY+16+i*16;
    const isMe = gs.state==='dead' && e.score===gs.score && e.name===lastEnteredName;
    ctx.fillStyle=isMe?'#FFEB3B':i===0?'#FFD700':i<3?'#C0C0C0':'rgba(255,255,255,0.7)';
    ctx.textAlign='left';
    ctx.fillText(`${i+1}.`,cx-120,y);
    ctx.fillText(e.name.padEnd(12,' '),cx-100,y);
    ctx.textAlign='right';
    ctx.fillText(String(e.score).padStart(8,'0'),cx+100,y);
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.fillText(`${e.lines}L`,cx+120,y);
  }
  ctx.textAlign='left';
}

/* ── Start screen ─────────────────────────────────────────────────── */
function drawStart() {
  ctx.fillStyle='rgba(0,0,0,0.83)'; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.textAlign='center';
  ctx.font='bold 50px monospace'; ctx.fillStyle='#fff';
  ctx.fillText('LINE RUNNER',BASE_W/2,BASE_H/2-108);
  ctx.font='14px monospace'; ctx.fillStyle='#00E5FF';
  ctx.fillText('Chase the lines. Snort to survive.',BASE_W/2,BASE_H/2-72);
  ctx.fillStyle='#FF5252';
  ctx.fillText('Meth \u2192 2nd hit = overdose  |  Shrooms \u2192 visions  |  LSD \u2192 reversed controls',BASE_W/2,BASE_H/2-52);
  ctx.font='11px monospace'; ctx.fillStyle='#FFEB3B';
  ctx.fillText('DESKTOP: \u2190 \u2192 move  |  SPACE/\u2191 jump  |  double-jump enabled',BASE_W/2,BASE_H/2-28);
  ctx.fillText('MOBILE:  \u25c4 \u25ba buttons  |  \u25b2 jump  (bottom of screen)',BASE_W/2,BASE_H/2-12);
  drawLeaderboard(BASE_W/2,BASE_H/2+8,5);
  const pulse=0.65+0.35*Math.sin(Date.now()/430);
  ctx.globalAlpha=pulse; ctx.fillStyle='#fff'; ctx.font='bold 16px monospace';
  ctx.fillText('TAP  or  PRESS SPACE  to start',BASE_W/2,BASE_H-24);
  ctx.globalAlpha=1; ctx.textAlign='left';
}

/* ── Death screen ─────────────────────────────────────────────────── */
function drawDead() {
  if (gs.deathT>95) return;
  const fa=clamp((95-gs.deathT)/35,0,1);
  ctx.globalAlpha=fa*0.9; ctx.fillStyle='#000'; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.globalAlpha=fa; ctx.textAlign='center';
  ctx.font='bold 38px monospace'; ctx.fillStyle='#FF1744';
  ctx.fillText('CRASHED OUT',BASE_W/2,BASE_H/2-100);
  ctx.font='17px monospace'; ctx.fillStyle='#fff';
  ctx.fillText(`Lines snorted: ${gs.linesCount}`,BASE_W/2,BASE_H/2-70);
  ctx.fillText(`Score: ${gs.score}`,BASE_W/2,BASE_H/2-48);
  drawLeaderboard(BASE_W/2,BASE_H/2-28,7);
  if (gs.deathT<=0 && gs.nameShown) {
    const pulse=0.65+0.35*Math.sin(Date.now()/430);
    ctx.globalAlpha=fa*pulse; ctx.fillStyle='#fff'; ctx.font='bold 14px monospace';
    ctx.fillText('TAP  or  PRESS SPACE  to retry',BASE_W/2,BASE_H-20);
  }
  ctx.globalAlpha=1; ctx.textAlign='left';
}

/* ════════════════════════════════════════════════════════════════════
   NAME ENTRY (HTML overlay)
   ════════════════════════════════════════════════════════════════════ */
let lastEnteredName = '';

function showNameEntry() {
  if (!qualifiesForBoard(gs.score) && gs.score===0) { gs.nameShown=true; return; }
  if (!qualifiesForBoard(gs.score)) { gs.nameShown=true; return; }

  const board=getBoard();
  const isTopScore=!board.length||gs.score>=(board[0]||{score:0}).score;
  document.getElementById('nameTitle').textContent=isTopScore?'\u2605 NEW HIGH SCORE! \u2605':'YOU MADE THE BOARD!';
  const wrap=document.getElementById('nameWrap');
  const inp2=document.getElementById('nameInput');
  inp2.value='';
  wrap.style.display='block';
  inp2.focus();
}

document.getElementById('nameBtn').addEventListener('click', submitName);
document.getElementById('nameInput').addEventListener('keydown', e=>{
  if (e.key==='Enter') submitName();
  e.stopPropagation(); // prevent space from starting game
});

function submitName() {
  const raw=document.getElementById('nameInput').value.trim()||'ANON';
  lastEnteredName=raw.toUpperCase().slice(0,12);
  document.getElementById('nameWrap').style.display='none';
  addToBoard(lastEnteredName,gs.score,gs.linesCount);
  gs.nameShown=true;
}

/* ════════════════════════════════════════════════════════════════════
   INIT + LOOP
   ════════════════════════════════════════════════════════════════════ */
function startGame() {
  if (gs.state==='dead' && gs.deathT>0) return;
  document.getElementById('nameWrap').style.display='none';
  Object.assign(gs, {
    state:'playing', score:0, linesCount:0,
    speed:CFG.baseScroll, coc:CFG.cocaineStart,
    camX:0, minCamX:0, shakeX:0, shakeY:0, shakeMag:0,
    flashA:0, flashColor:'#FFFFFF', hue:0, deathT:0,
    vision:null, visionTimer:0,
    effects:{ methCount:0, meth:0, shrooms:0, lsd:0 },
    platforms:[], drugItems:[], lineObjs:[], particles:[], popups:[],
    nameShown:false,
  });
  nextPlatX=350; snortIdx=0;
  gs.player=makePlayer();
  genPlatforms();
}

function update() {
  if (gs.state==='playing') {
    if (gs.visionTimer>0) {
      gs.visionTimer--;
      if (gs.visionTimer===0) gs.vision=null;
      updateParticles();
      return; // game paused during vision
    }
    updatePlayer();
    updateCamera();
    genPlatforms();
    updateDrugs();
    updateLineObjs();
    updateCocaine();
    updateEffects();
    updateParticles();
    updatePopups();
    gs.hue=(gs.hue+gs.speed*0.22)%360;
    gs.score+=scoreMultiplier();
  } else if (gs.state==='dead') {
    gs.deathT=Math.max(0,gs.deathT-1);
    updateParticles();
    if (gs.shakeMag>0.1) updateCamera();
    if (gs.deathT===65 && !gs.nameShown) showNameEntry();
  }
}

function draw() {
  // Apply drug filters to world rendering
  const filt=getDrugFilter();
  if (filt) ctx.filter=filt;

  drawBG();
  drawPlatforms();
  drawLineObjs();
  drawDrugs();
  drawPlayer();
  drawParticles();

  ctx.filter='none'; // reset for UI

  drawEffects();
  drawHUD();
  drawTouchBtns();
  drawPopups();
  drawVision();
  drawPortraitWarning();
  if (gs.state==='start') drawStart();
  if (gs.state==='dead')  drawDead();
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
